[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Intentional barrel re-export pattern.
"src/utils/__init__.py" = ["F403", "F405"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
